[versions]
# ⚠️ VERSIONS VALIDEES PAR BUILD REEL (2026-09-24, /tmp/opencode/smoke2)
# Ne PAS "moderniser" a l'aveugle : chaque couple ci-dessous a ete teste ensemble.
kotlin = "2.3.21"      # 2.4.x CASSE Hilt (metadata max 2.3.0)
agp = "9.4.1"
ksp = "2.3.12"         # versionnage decouple de Kotlin depuis 2.3
hilt = "2.59.2"        # 2.52 ne supporte pas KSP/Kotlin recents
composeBom = "2024.12.01"
ktor = "2.3.11"
serialization = "1.7.3"
coroutines = "1.9.0"
markdownRenderer = "0.28.0"
coil = "2.7.0"
unifiedpush = "3.3.5"
lucide = "1.1.0"
datastore = "1.1.7"
# ⚠️ `highlights` arrive deja en TRANSITIF de `multiplatform-markdown-renderer-code`.
# On le declare explicitement parce que `ChatScreen` l'utilise en direct (theme de
# coloration) : sans cette ligne, une montee de version du renderer qui changerait sa
# dependance interne casserait la compilation. AUCUNE nouvelle dependance n'est ajoutee.
highlights = "1.0.0"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.9.3" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version = "2.8.7" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.2.0" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
markdown-renderer = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
markdown-renderer-code = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-code", version.ref = "markdownRenderer" }
# Deja transitif via `markdown-renderer-code` ; declare pour l'usage direct dans ChatScreen.
highlights = { group = "dev.snipme", name = "highlights", version.ref = "highlights" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
lucide = { group = "com.composables", name = "icons-lucide", version.ref = "lucide" }
# UnifiedPush : reception de push sans Play Services (Pixel GrapheneOS).
# ⚠️ La lib declare ELLE-MEME ses receveurs, RAISE_TO_FOREGROUND, WAKE_LOCK et <queries>
# dans son manifest : ne PAS les redupliquer, un doublon casse le routage.
unifiedpush-connector = { group = "org.unifiedpush.android", name = "connector", version.ref = "unifiedpush" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
junit = { group = "junit", name = "junit", version = "4.13.2" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }

[plugins]
# ⚠️ AGP 9.x INTEGRE Kotlin : declarer `org.jetbrains.kotlin.android` ECHOUE
#    ("The 'org.jetbrains.kotlin.android' plugin is no longer required since AGP 9.0")
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
